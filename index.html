<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual AI Assistant · Board performance brief · V13</title>
<style>
:root {
  color-scheme: light;
  --page: #f3f3ef;
  --surface: #fcfcfb;
  --ink-1: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --s1: #2a78d6;
  --s1-soft: rgba(42, 120, 214, 0.10);
  --s2: #eb6834;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --good-text: #006300;
  --bad-text: #b8322f;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Leelawadee UI", Thonburi, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink-1); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body { font-size: 14px; line-height: 1.5; }
.page { max-width: 1240px; margin: 0 auto; padding: 28px 32px 48px; }

/* header */
.topline { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.brand-mark { width: 10px; height: 10px; border-radius: 3px; background: var(--s1); }
.top-actions { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); }
.btn { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-1); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--axis); }
h1 { font-size: 30px; line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; margin: 18px 0 6px; }
.subtitle { color: var(--ink-2); margin: 0; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; }
.chip b { color: var(--ink-1); font-weight: 600; }

/* summary */
.summary { margin-top: 22px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; box-shadow: 0 1px 2px rgba(11, 11, 11, 0.04); }
.summary-lead { font-size: 18px; line-height: 1.45; font-weight: 550; margin: 0 0 16px; max-width: 70ch; }
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 14px 22px; }
.point { border-left: 3px solid var(--grid); padding-left: 12px; }
.point h3 { margin: 0 0 4px; font-size: 13px; font-weight: 650; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.point p { margin: 0; color: var(--ink-2); font-size: 13px; }
.foot { margin: 10px 0 0; font-size: 12px; color: var(--ink-2); max-width: 100ch; }

/* status pill: icon + label, never color alone */
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650; color: var(--ink-1); border-radius: 999px; padding: 2px 8px 2px 4px; white-space: nowrap; }
.status svg { width: 14px; height: 14px; flex: none; }
.status-good { background: rgba(12, 163, 12, 0.10); }
.status-watch { background: rgba(250, 178, 25, 0.20); }
.status-act { background: rgba(208, 59, 59, 0.10); }
.icon-only { width: 22px; height: 22px; margin-top: 1px; }

/* sections */
section { margin-top: 34px; }
.sec-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 4px 16px; margin-bottom: 14px; }
.sec-head h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.005em; }
.sec-head p { grid-column: 1 / -1; margin: 0; color: var(--ink-2); font-size: 13px; max-width: 96ch; }
.sec-head .when { font-size: 12px; color: var(--ink-3); text-align: right; }
@media (max-width: 760px) { .sec-head { grid-template-columns: 1fr; } .sec-head .when { text-align: left; } }

/* data source parts */
.part { display: flex; gap: 16px; align-items: flex-start; margin-top: 44px; padding: 18px 22px; border-radius: var(--radius); border: 1px solid var(--border); }
.part1 { background: rgba(42, 120, 214, 0.07); border-left: 5px solid var(--s1); }
.part2 { background: rgba(235, 104, 52, 0.08); border-left: 5px solid var(--s2); }
.part3 { background: rgba(11, 11, 11, 0.04); border-left: 5px solid var(--ink-2); }
.part-tag { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; white-space: nowrap; margin-top: 3px; }
.part-title { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.part-sub { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
.part + section { margin-top: 22px; }
.src { display: inline-block; vertical-align: middle; font-size: 11px; font-weight: 600; letter-spacing: 0; border-radius: 999px; padding: 2px 9px; margin-left: 8px; white-space: nowrap; }
.src1 { background: rgba(42, 120, 214, 0.12); color: #1c5cab; }
.src2 { background: rgba(235, 104, 52, 0.14); color: #a8431a; }
.srcb { background: rgba(11, 11, 11, 0.07); color: var(--ink-2); }
.pt-src { margin: -2px 0 6px; }
.pt-src .src { margin-left: 0; }
.th-src { display: block; font-size: 10px; font-weight: 600; color: var(--ink-3); }
.li-src { font-size: 10px; font-weight: 600; color: var(--ink-3); border: 1px solid var(--grid); border-radius: 999px; padding: 0 6px; white-space: nowrap; }
@media (max-width: 640px) { .part { flex-direction: column; gap: 8px; padding: 14px 16px; } .part-title { font-size: 19px; } }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile-label { font-size: 12px; color: var(--ink-2); font-weight: 550; }
.tile-value { font-size: 30px; line-height: 1.15; font-weight: 650; letter-spacing: -0.01em; }
.tile-value small { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.tile-note { font-size: 12px; color: var(--ink-3); }
.delta { font-size: 12px; font-weight: 600; }
.delta.good { color: var(--good-text); }
.delta.bad { color: var(--bad-text); }
.delta.flat { color: var(--ink-2); }
.spark { height: 30px; margin-top: 4px; }

/* cards */
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.stack { display: grid; gap: 14px; }
.card-wide { padding: 22px 24px 16px; }
.card-wide h3 { font-size: 16px; }
.card-wide .note { font-size: 13px; }
.card-wide .tick { font-size: 12px; }
.card-wide .lbl, .card-wide .lbl-strong { font-size: 13px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 18px 14px; min-width: 0; }
.card h3 { margin: 0; font-size: 14px; font-weight: 650; }
.card .note { margin: 3px 0 10px; color: var(--ink-3); font-size: 12px; }
.chart { position: relative; }
.chart svg { display: block; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 0 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.key-s1 { background: var(--s1); }
.key-s2 { background: var(--s2); }

/* svg marks */
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.tick { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.lbl { fill: var(--ink-2); font-size: 12px; }
.lbl-strong { fill: var(--ink-1); font-size: 12px; font-weight: 650; }
.val { fill: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.bar-s1 { fill: var(--s1); }
.bar-s2 { fill: var(--s2); }
.bar-partial { fill: var(--s1); opacity: 0.4; }
.line-s1 { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.line-s2 { fill: none; stroke: var(--s2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dot-s2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
.dot-s1 { fill: var(--s1); stroke: none; }
.target { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 4 4; }
.target-lbl { fill: var(--ink-3); font-size: 11px; }
.bar-soft { fill: var(--s1); opacity: 0.78; }
.line-ink { fill: none; stroke: #1f2a37; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.dot-ink { fill: #1f2a37; stroke: none; }
.tip-key.ink { background: #1f2a37; }
.key-line-ink { display: inline-block; width: 16px; height: 3px; border-radius: 2px; background: #1f2a37; }
.band { fill: var(--ink-1); opacity: 0.05; }
.cross { stroke: var(--axis); stroke-width: 1; }
.hit { fill: transparent; cursor: default; outline: none; }
.hit:focus-visible { stroke: var(--s1); stroke-width: 1.5; }
.spark-line { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.spark-dot { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
.lift { filter: brightness(1.12); }

/* tooltip */
.tip { position: absolute; z-index: 10; pointer-events: none; background: #ffffff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(11, 11, 11, 0.12); padding: 8px 10px; font-size: 12px; white-space: nowrap; }
.tip-head { color: var(--ink-2); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 6px; }
.tip-row strong { font-weight: 650; color: var(--ink-1); font-variant-numeric: tabular-nums; }
.tip-label { color: var(--ink-2); }
.tip-key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
.tip-key.s1 { background: var(--s1); }
.tip-key.s2 { background: var(--s2); }
.tip-key.sq { width: 9px; height: 9px; border-radius: 2px; }

/* segmented bar */
.seg { display: flex; gap: 2px; height: 28px; margin: 10px 0 6px; }
.seg div { border-radius: 4px; display: flex; align-items: center; padding: 0 8px; color: #ffffff; font-size: 12px; font-weight: 650; white-space: nowrap; overflow: hidden; }
.seg .seg-s1 { background: var(--s1); }
.seg .seg-s2 { background: var(--s2); }
.big { font-size: 44px; line-height: 1.05; font-weight: 650; letter-spacing: -0.02em; margin: 8px 0 2px; }
.big-note { font-size: 12px; color: var(--ink-3); }

/* quotes */
.quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; margin-top: 12px; }
.quote { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.quote blockquote { margin: 0; font-size: 14px; line-height: 1.45; font-weight: 550; }
.quote .orig { margin: 6px 0 0; font-size: 12px; color: var(--ink-3); }
.quote .who { margin: 8px 0 0; font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.dotkey { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* tables */
.table-wrap { overflow-x: auto; }
table.cap { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
table.cap th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 8px 10px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
table.cap td { padding: 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.cap td.num, table.cap th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.cap tr:last-child td { border-bottom: none; }
.cap-name { font-weight: 650; }
.cap-sub { font-size: 12px; color: var(--ink-3); }
.cap-note { color: var(--ink-2); font-size: 12px; max-width: 34ch; }
.small-up { color: var(--bad-text); font-size: 11px; font-weight: 600; display: block; }
.small-down { color: var(--good-text); font-size: 11px; font-weight: 600; display: block; }
.small-flat { color: var(--ink-3); font-size: 11px; display: block; }

.tooltbl { min-width: 900px; }
.areatbl { min-width: 640px; }
.areatbl td.cap-note { max-width: 60ch; }
.tooltbl td.cap-note { max-width: 40ch; }
.tf { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.tf button { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-2); background: transparent; border: 0; padding: 6px 14px; cursor: pointer; }
.tf button + button { border-left: 1px solid var(--border); }
.tf button[aria-pressed="true"] { background: var(--ink-1); color: #ffffff; }
.tf-sum { margin: 0 0 8px; font-size: 13px; color: var(--ink-2); }
.tf-sum b { color: var(--ink-1); font-weight: 650; }
[data-tf-panel][hidden] { display: none; }
.tool-note { font-size: 12px; color: var(--ink-2); margin-top: 3px; max-width: 30ch; }
.spark-cell { width: 150px; }
.tspark { position: relative; width: 150px; height: 36px; }
.status-idle { background: rgba(137, 135, 129, 0.14); }
details.data { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
details.data summary { cursor: pointer; color: var(--ink-3); }
details.data table { border-collapse: collapse; margin-top: 6px; font-size: 12px; }
details.data th, details.data td { padding: 3px 10px 3px 0; text-align: left; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
details.data th { color: var(--ink-2); font-weight: 600; }

/* priorities */
.prios { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.prio { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; position: relative; }
.prio-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-3); }
.prio-rank { font-size: 22px; font-weight: 650; color: var(--axis); line-height: 1; }
.tag { font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 999px; }
.tag-p0 { background: rgba(208, 59, 59, 0.10); color: var(--bad-text); }
.tag-p1 { background: rgba(42, 120, 214, 0.10); color: #1c5cab; }
.prio h3 { margin: 0; font-size: 14px; line-height: 1.35; font-weight: 650; }
.prio ul { margin: 0; padding-left: 16px; color: var(--ink-2); font-size: 12px; display: grid; gap: 3px; }
.prio .owner { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--grid); font-size: 12px; color: var(--ink-3); }
.targets { margin-top: 12px; font-size: 12px; color: var(--ink-2); background: var(--s1-soft); border-radius: 10px; padding: 10px 14px; }

/* notes */
.notes { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 12px; color: var(--ink-2); }
.notes b { color: var(--ink-1); font-weight: 600; }
footer { margin-top: 18px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--ink-3); }

@media (max-width: 760px) {
  table.cap { min-width: 0; }
  table.cap thead { display: none; }
  table.cap, table.cap tbody, table.cap tr, table.cap td { display: block; width: 100%; }
  table.cap tr { border-bottom: 1px solid var(--grid); padding: 10px 0; }
  table.cap tr:last-child { border-bottom: none; }
  table.cap td { border: none; padding: 3px 0; }
  table.cap td.num, table.cap td[data-label] { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; text-align: right; }
  table.cap td[data-label]::before { content: attr(data-label); color: var(--ink-3); font-size: 12px; text-align: left; white-space: nowrap; }
  table.cap td.cap-note { text-align: right; max-width: none; }
  table.cap td .cv { text-align: right; }
  .tooltbl { min-width: 0; }

  table.cap td .small-up, table.cap td .small-down, table.cap td .small-flat { display: inline; margin-left: 6px; }
}

@media (max-width: 640px) {
  .page { padding: 18px 14px 36px; }
  h1 { font-size: 24px; }
  .summary { padding: 16px; }
  .summary-lead { font-size: 16px; }
  .tile-value { font-size: 26px; }
  .big { font-size: 38px; }
}

@media print {
  html, body { background: #ffffff; }
  .page { max-width: none; padding: 0; }
  .btn, details.data { display: none; }
  .summary, .tile, .card, .quote, .prio, .notes { box-shadow: none; break-inside: avoid; }
  section { break-inside: auto; }
}

/* live loading */
.loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--page); z-index: 50; }
.loading[hidden], .load-error[hidden] { display: none; }
.loading-box { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 22px; box-shadow: 0 6px 24px rgba(11, 11, 11, 0.06); }
.loading-title { font-weight: 650; font-size: 15px; }
.loading-step { color: var(--ink-2); font-size: 13px; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--grid); border-top-color: var(--s1); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.load-error { max-width: 640px; margin: 80px auto; padding: 0 24px; }
.load-error-box { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--critical); border-radius: var(--radius); padding: 20px 24px; }
.load-error-box h2 { margin: 0 0 8px; font-size: 18px; }
.load-error-box p { color: var(--ink-2); margin: 0 0 10px; }
.chip.live { display: inline-flex; align-items: center; gap: 6px; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; }
@media print { .loading, .load-error { display: none !important; } }
.quotes-title { font-size: 14px; font-weight: 650; margin: 18px 0 0; }
.chip.warn .live-dot { background: var(--warning); }

/* review and export */
.btn-export { display: inline-flex; align-items: center; gap: 6px; }
.btn-export svg { width: 14px; height: 14px; }
.btn-primary { background: var(--s1); border-color: var(--s1); color: #fff; }
.btn-primary:hover { background: #1f66bd; border-color: #1f66bd; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.export-inline { margin-top: 12px; }
.review-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 14px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.export-status { font-size: 12px; color: var(--ink-3); }
.reviewtbl td.teach { color: var(--ink-2); font-size: 13px; max-width: 420px; }
@media print { .review-bar, .export-inline, .reviewtbl th:last-child, .reviewtbl td:last-child { display: none; } }

/* timeframe filter */
.filter-bar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 18px 0 28px; padding: 12px 16px; background: rgba(252, 252, 251, 0.96); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(11, 11, 11, 0.05); backdrop-filter: blur(6px); }
.fb-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.range-tabs button { padding: 7px 14px; font-size: 13px; }
.fb-custom { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.fb-custom label { display: inline-flex; align-items: center; gap: 6px; }
.fb-custom input[type="date"] { font: inherit; font-size: 13px; color: var(--ink-1); padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.fb-custom .btn { padding: 6px 14px; }
.fb-note { flex-basis: 100%; margin: 0; font-size: 12px; color: var(--ink-3); }
@media (max-width: 760px) { .filter-bar { position: static; } .range-tabs { flex-wrap: wrap; } }
@media print { .filter-bar { position: static; box-shadow: none; } .range-tabs button:not([aria-pressed="true"]), .fb-custom { display: none; } }

[hidden] { display: none !important; }

/* customer ratings in tool health */
.rate-h { color: #1d5fae; font-weight: 650; }
.rate-nh { color: #b8481a; font-weight: 650; }
.rate-nh.zero { color: var(--ink-3); font-weight: 400; }
.muted { color: var(--ink-3); }

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
<div class="loading" id="loading" role="status" aria-live="polite"><div class="loading-box"><div class="spinner" aria-hidden="true"></div><div><div class="loading-title">Loading the latest data</div><div class="loading-step" id="loading-step">Fetching the chat log from Google Sheets</div></div></div></div>
<div class="load-error" id="load-error" hidden><div class="load-error-box"><h2>The dashboard could not load its data</h2><p id="load-error-msg"></p><p>Check that the Google Sheet is still published to the web as CSV (File, Share, Publish to web) and that the address in CONFIG.DATA_URL is correct, then reload the page.</p><button class="btn" type="button" onclick="location.reload()">Reload</button></div></div>
<div class="page" id="page"></div>
<template id="page-tpl">

  <header>
    <div class="topline">
      <div class="brand"><span class="brand-mark"></span>Supersports · Virtual AI Assistant</div>
      <div class="top-actions"><button class="btn" type="button" data-print>Print or save as PDF</button></div>
    </div>
    <h1>How the AI assistant is performing</h1>
    <p class="subtitle">A board-level view of demand, speed, reliability and customer satisfaction for the online chat assistant.</p>
    <div class="chips">
      <span class="chip">Operations <b>{{ops_from}} to {{ops_to}}</b> ({{ops_days}} days)</span>
      <span class="chip">Customer ratings <b>{{fb_from}} to {{fb_to}}</b> ({{fb_n}} ratings)</span>
      <span class="chip">Bangkok time</span>
      {{data_chip}}
    </div>
  </header>

  <div class="filter-bar" id="filter-bar" role="group" aria-label="Timeframe filter">
    <span class="fb-label">Timeframe</span>
    <div class="tf range-tabs">{{range_tabs}}</div>
    <div class="fb-custom">
      <label>From <input type="date" id="range-from" value="{{range_from}}" min="{{range_min}}" max="{{range_max}}"></label>
      <label>To <input type="date" id="range-to" value="{{range_to}}" min="{{range_min}}" max="{{range_max}}"></label>
      <button class="btn" type="button" id="range-apply">Apply</button>
    </div>
    <p class="fb-note">{{range_note}}</p>
  </div>

  <div class="part part1" id="part-ops">
    <div class="part-tag">Part 1</div>
    <div><h2 class="part-title">Operations: how the assistant runs</h2>
    <p class="part-sub">From the chat log of every question and answer · {{ops_from}} to {{ops_to}} ({{ops_days}} days) · {{questions}} questions in {{chats}} chats</p></div>
  </div>
  <section id="glance">
    <div class="sec-head"><h2>At a glance</h2><span class="when">{{glance_when}}</span></div>
    <div class="tiles">
      <div class="tile">
        <div class="tile-label">Chats</div>
        <div class="tile-value">{{chats}}</div>
        <div class="tile-note">{{chats_day}} a day on average</div>
        {{tiles_chats_delta}}
        <div class="spark" id="spark-chats"></div>
      </div>
      <div class="tile">
        <div class="tile-label">Questions answered</div>
        <div class="tile-value">{{questions}}</div>
        <div class="tile-note">{{q_day}} a day on average</div>
        {{tiles_q_delta}}
        <div class="spark" id="spark-questions"></div>
      </div>
      <div class="tile">
        <div class="tile-label">Average response time</div>
        <div class="tile-value">{{lat}}</div>
        <div class="tile-note">{{under15}} within 15 seconds · target 8s</div>
        {{tiles_lat_delta}}
        <div class="spark" id="spark-latency"></div>
      </div>
      <div class="tile">
        <div class="tile-label">Technical failure rate</div>
        <div class="tile-value">{{fail}}</div>
        <div class="tile-note">{{failed}} answers {{since_txt}}</div>
        {{tiles_fail_delta}}
        <div class="spark" id="spark-fail"></div>
      </div>
      <div class="tile">
        <div class="tile-label">Searches with no result</div>
        <div class="tile-value">{{zero}}</div>
        <div class="tile-note">{{zero_n}} of {{prod_n}} searches</div>
        {{tiles_zero_delta}}
        <div class="spark" id="spark-zero"></div>
      </div>
    </div>
  </section>

  <section id="trend">
    <div class="sec-head">
      <h2>Demand and service quality, week by week</h2>
      <p>{{trend_lede}}</p>
    </div>
    <div class="stack">
      <div class="card card-wide">
        <h3>Questions answered per day and average response time</h3>
        <p class="note">Weekly averages · {{partial_bar_note}}dashed line: 8-second target · “no time”: response times not recorded that week · hover a week to see both</p>
        <div class="legend"><span><i class="key key-s1"></i>Questions a day (left axis)</span><span><i class="key-line-ink"></i>Average response time (right axis)</span></div>
        <div class="chart" id="chart-combo"></div>
      </div>
      <div class="card card-wide">
        <h3>Technical failure rate</h3>
        <p class="note">Share of answers where an error or raw data reached the customer · gaps: days with no tool details in the log</p>
        <div class="chart" id="chart-fail"></div>
      </div>
    </div>
    {{tbl_weeks}}
    <p class="foot">{{why_foot}}</p>
  </section>

  <section id="tools">
    <div class="sec-head">
      <h2>Tool-level health</h2>
      <div class="tf" role="group" aria-label="Time frame for tool-level health"{{tf_switch_hidden}}>
        <button type="button" data-tf="all" aria-pressed="true">All time</button>
        <button type="button" data-tf="l28" aria-pressed="false">Last 4 weeks</button>
      </div>
      <p>The technical view of each tool. {{tf_switch_txt}} how customers rate each area is in Customer rating by area, Part 2.</p>
    </div>
    <div class="card" data-tf-panel="all"{{tf_all_hidden}}>
      <p class="tf-sum"><b>{{ops_from}} to {{ops_to}}</b> · {{tool_sum_all}}</p>
      <div class="table-wrap"><table class="cap tooltbl"><thead><tr><th>Tool</th><th class="num">Questions</th><th class="num">Share of questions</th><th class="num">Avg response</th><th class="num">Technical failures</th><th class="num">Helpful</th><th class="num">Not helpful</th><th>Status</th><th>What to notice</th></tr></thead><tbody><!--{{tool_rows_all}}--></tbody></table></div>
    </div>
    <div class="card" data-tf-panel="l28"{{tf_l28_hidden}}>
      <p class="tf-sum"><b>{{l28_from}} to {{l28_to}}</b> · {{tool_sum_l28}} Changes compare with {{prev_txt}} ({{p28_from}} to {{p28_to}}).</p>
      <div class="table-wrap"><table class="cap tooltbl"><thead><tr><th>Tool</th><th class="num">Questions</th><th class="num">Share of questions</th><th class="num">Avg response</th><th class="num">Technical failures</th><th class="num">Helpful</th><th class="num">Not helpful</th><th>Status</th><th>What to notice</th></tr></thead><tbody><!--{{tool_rows_l28}}--></tbody></table></div>
    </div>
    <p class="foot">{{tool_ratings_note}}</p>
    <p class="foot">Answers given without any tool (greetings, thanks and other small talk) are left out of this table; shares are of all questions. Status follows V10's thresholds for the chosen time frame: Act now at 40% failures or more, Watch at 10% or more, Good below that, Idle under 30 uses. Response times leave out days when they were not recorded.</p>
  </section>

  <section id="missed">
    <div class="sec-head">
      <h2>Searches that found nothing</h2>
      <p>{{zero_n}} product searches {{since_txt}} ({{zero}} of all product searches, in {{zero_chat_share}} of chats) returned nothing: buyer intent the assistant could not serve, from catalog gaps, sold-out sizes or search misses.</p>
    </div>
    <div class="grid-2">
      <div class="card">
        <h3>By sport or category</h3>
        <p class="note">Another {{model_lookups}} searches ({{model_share}}) named a specific model without a category</p>
        <div class="chart" id="chart-categories"></div>
        {{tbl_cats}}
      </div>
      <div class="card">
        <h3>By brand named</h3>
        <p class="note">{{brand_total}} of the searches named one of the tracked brands</p>
        <div class="chart" id="chart-brands"></div>
        {{tbl_brands}}
      </div>
    </div>
  </section>

  <div class="part part2" id="part-feedback">
    <div class="part-tag">Part 2</div>
    <div><h2 class="part-title">Customer feedback: how customers rate the answers</h2>
    <p class="part-sub">From the Helpful or Not helpful feedback buttons, added later (first ratings on {{fb_first}}) · {{fb_from}} to {{fb_to}} ({{fb_n}} ratings in {{fb_chats}} chats) · {{fb_source}}</p></div>
  </div>
  <section id="customers">
    <div class="sec-head">
      <h2>What customers say about the answers</h2>
      <p>{{fb_lede}}</p>
    </div>
    <div class="grid-3">
      <div class="card">
        <h3>Helpful rate</h3>
        <p class="note">{{fb_n}} ratings from {{fb_chats}} chats</p>
        <div class="big">{{rate}}</div>
        <div class="big-note">95% range {{ci_lo}} to {{ci_hi}}{{ci_note}}</div>
        <div class="seg" role="img" aria-label="{{helpful}} Helpful and {{nh_total}} Not helpful ratings">
          <div class="seg-s1" style="flex: {{helpful}}">{{helpful}} Helpful</div>
          <div class="seg-s2" style="flex: {{nh_total}}">{{nh_total}} Not helpful</div>
        </div>
        <p class="note" style="margin-top:12px">{{lang_sentence}} About {{coverage}} of answers get a rating (estimate).</p>
      </div>
      <div class="card">
        <h3>Helpful rate by topic</h3>
        <p class="note">What the customer asked about · most Not helpful first</p>
        <div class="legend"><span><i class="key key-s1"></i>Helpful</span><span><i class="key key-s2"></i>Not helpful</span></div>
        <div class="chart" id="chart-topics"></div>
        {{tbl_topics}}
        <div class="export-inline"><button class="btn btn-export" type="button" data-export="all"{{export_disabled}}><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0l-3-3m3 3l3-3M3 12.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Export questions and answers to Excel</button></div>
      </div>
      <div class="card">
        <h3>Why customers said Not helpful</h3>
        <p class="note">Main reason for each of the {{nh_total}} Not helpful ratings</p>
        <div class="chart" id="chart-causes"></div>
        {{tbl_causes}}
      </div>
    </div>
    <h3 class="quotes-title">Latest customer comments</h3>
    <div class="quotes">{{quotes}}</div>
  </section>

  <section id="review">
    <div class="sec-head">
      <h2>Review the answers and teach the AI</h2>
      <p>{{review_lede}}</p>
    </div>
    <div class="card">
      <div class="review-bar">
        <button class="btn btn-export btn-primary" type="button" data-export="all"{{export_disabled}}><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0l-3-3m3 3l3-3M3 12.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Export all topics to Excel</button>
        <label class="check"><input type="checkbox" id="export-nh-only"{{export_disabled}}> Not helpful answers only</label>
        <span class="export-status" id="export-status" role="status" aria-live="polite">{{export_note}}</span>
      </div>
      <div class="table-wrap">
        <table class="cap reviewtbl">
          <thead><tr><th>Topic</th><th class="num">Ratings</th><th class="num">Not helpful</th><th>Main reason</th><th>What to teach the AI</th><th>Export</th></tr></thead>
          <tbody><!--{{review_rows}}--></tbody>
        </table>
      </div>
      <p class="note" style="margin:10px 0 0">The Excel file lists every rated question with the AI's answer, the customer's comment and a suggested lesson, plus an empty column for the team to write the <b>expected answer</b>. Emails, phone numbers and order numbers are hidden. Topics and reasons for new ratings come from keyword rules, so check them while reviewing.</p>
    </div>
  </section>

  <section id="capabilities">
    <div class="sec-head">
      <h2>Customer rating by area</h2>
      <p>{{area_lede}}</p>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table class="cap areatbl">
          <thead><tr><th>Area</th><th class="num">Customer rating</th><th>Status</th><th>Why</th></tr></thead>
          <tbody><!--{{cap_rows}}--></tbody>
        </table>
      </div>
      <p class="note" style="margin:10px 0 0">Ratings are matched to each area by the topic of the customer's question. Status follows the helpful rate: Act now under 45% (with 10 or more ratings), Watch under 60% or with fewer than 10 ratings, Good at 60% or more. "Why" names the most common reason for Not helpful ratings in that area.</p>
    </div>
  </section>

  <div class="part part3" id="part-combined">
    <div class="part-tag">Part 3</div>
    <div><h2 class="part-title">Priorities</h2>
    <p class="part-sub">What to fix next, drawing on both the operations figures in Part 1 and the customer feedback in Part 2.</p></div>
  </div>
  <section id="priorities">
    <div class="sec-head">
      <p>Ranked by impact on customers. Owners are suggestions.</p>
    </div>
    <div class="prios">
      <div class="prio">
        <div class="prio-top"><span class="tag tag-p0">P0 · Now</span><span class="prio-rank">1</span></div>
        <h3>Connect live promotions and discount codes to the assistant</h3>
        <ul>
          <li>{{promo_bullet}}</li>
          <li>{{promo_h}} of {{promo_n}} promotion answers rated helpful</li>
          <li>{{promo_nh}} of {{nh_total}} Not helpful ratings: the free-shipping line instead of a code</li>
        </ul>
        <div class="owner">Owner: E-commerce and AI team</div>
      </div>
      <div class="prio">
        <div class="prio-top"><span class="tag tag-p0">P0 · Now</span><span class="prio-rank">2</span></div>
        <h3>Make product search respect sizes and close catalog gaps</h3>
        <ul>
          <li>{{zero}} of product searches found nothing ({{zero_n}} {{since_txt}})</li>
          <li>{{size_only}} of {{nh_total}} Not helpful ratings: size, gender or type ignored, plus {{dup_n}} with the same item listed repeatedly</li>
          <li>Most-missed brands: {{top_brands}}</li>
        </ul>
        <div class="owner">Owner: AI team and merchandising</div>
      </div>
      <div class="prio">
        <div class="prio-top"><span class="tag tag-p1">P1 · Next</span><span class="prio-rank">3</span></div>
        <h3>Give a delivery date in every order answer</h3>
        <ul>
          <li>{{order_bullet}}</li>
          <li>Only {{order_h}} of {{order_n}} order answers rated helpful: no ship or arrival date</li>
        </ul>
        <div class="owner">Owner: AI team and fulfilment</div>
      </div>
      <div class="prio">
        <div class="prio-top"><span class="tag tag-p1">P1 · Next</span><span class="prio-rank">4</span></div>
        <h3>Offer a person when the assistant is stuck</h3>
        <ul>
          <li>{{repeat_chats}} chats hit Not helpful twice or more</li>
          <li>{{reply_needed}} comments asked a question or for a person, and the feedback box cannot reply</li>
        </ul>
        <div class="owner">Owner: Customer service</div>
      </div>
      <div class="prio">
        <div class="prio-top"><span class="tag tag-p1">P1 · Next</span><span class="prio-rank">5</span></div>
        <h3>{{demand_title}}</h3>
        <ul>
          <li>{{q_l28_day}} questions a day {{in_recent}}, {{q_change}}</li>
          <li>Weekly peak of {{peak_day}} a day was in {{peak_month}}</li>
        </ul>
        <div class="owner">Owner: E-commerce and marketing</div>
      </div>
    </div>
    <div class="targets"><b>Suggested targets for the next review:</b> helpful rate above 60%, promotion failures under 5%, product searches with no result under 10%, and average response time under the 8-second target.</div>
  </section>

  <section id="notes">
    <div class="sec-head"><h2>Notes and definitions</h2></div>
    <div class="notes">
      <ul>
        <li><b>Sources.</b> Part 1 {{s1_source}}: {{now}}{{questions}} answered questions in {{chats}} chats, {{ops_from}} to {{ops_to}}. Part 2 {{fb_source_note}}: {{now}}{{fb_n}} customer ratings in {{fb_chats}} chats, {{fb_from}} to {{fb_to}}. Part 3 mixes both. All times are Bangkok time.</li>
        <li><b>Questions answered</b> are rows in Sheet 1 (one customer question and the assistant's answer). <b>Chats</b> are distinct session IDs.</li>
        <li><b>Technical failure</b> uses V10's rule: a tool error or raw tool data reached the customer, or a product search gave no reply. One change: the refund tool's ready-made replies, passed on word for word, are complete answers and are not counted ({{refund_flagged}} since the tool started on {{refund_day}}). Counting those replies as failures, the rate would be {{fail_v10}} overall and {{fail_v10_l28}} in the last 4 weeks.</li>
        <li><b>Helpful rate</b> is Helpful ratings divided by all ratings. With {{fb_n}} ratings the true rate could be anywhere from {{ci_lo}} to {{ci_hi}}. About {{coverage}} of answers get a rating, roughly 1 in {{one_in}} (estimate: {{coverage_basis}}). {{coding_note}}</li>
        <li><b>Linking the two sheets.</b> Ratings share no trace IDs with Sheet 1, so they cannot be matched to individual answers; Customer rating by area matches them by the topic of the question.</li>
        {{gap_note}}
        <li><b>Searches that found nothing</b> use V10's lost demand rule on product search tools.</li>
        <li><b>Weeks</b> run {{week_span}} and end on the latest day in the sheet ({{ops_to}}){{partial_note}}. {{cmp_note}}</li>
      </ul>
    </div>
    <footer><span>{{footer_src}}</span><span>Board brief V13 · replaces V12</span></footer>
  </section>

</template>
<script>
// ============================================================
// SETTINGS. Sheet 1 (the chat log) is read live from the Google Sheet below,
// the same published CSV that V10 used.
// ============================================================
var CONFIG = {
  // Google Sheet published as CSV (File, Share, Publish to web, CSV)
  DATA_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRGMFK-952N9nSsKiOEJ4JvnuKtdUoe3a7LzqG87yNbmdIcwS_gllZmA0NKsMDei5EGaVSV0qC0moLO/pub?output=csv',

  // Sheet 2 (customer ratings) of the same Google Sheet, published as CSV.
  // In Google Sheets: File, Share, Publish to web. Under "Link" pick "Sheet2" and
  // "Comma-separated values (.csv)", then copy the link and paste it here.
  // Keep "Published content and settings" on "Entire document" so Sheet 1 stays published.
  // The address looks like .../pub?gid=NUMBER&single=true&output=csv
  // Left empty, Part 2 shows the stored copy of the first ratings.
  FEEDBACK_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRGMFK-952N9nSsKiOEJ4JvnuKtdUoe3a7LzqG87yNbmdIcwS_gllZmA0NKsMDei5EGaVSV0qC0moLO/pub?gid=1569231211&single=true&output=csv',

  LATENCY_TARGET: 8,          // seconds: dashed target line and "above target" flags
  IDLE_VOL_THRESHOLD: 30,     // tools with fewer uses than this are shown as Idle
  ACT_FAIL: 0.40,             // tool status Act now at this failure rate or more
  WATCH_FAIL: 0.10,           // tool status Watch at this failure rate or more
  OUTAGE_DAY_FAIL: 0.40,      // a day counts as an outage day for a tool above this failure rate

  // Tools considered "product search" for searches that found nothing
  PRODUCT_SEARCH_TOOLS: ['product_recommendation', 'product_guide', 'product_comparison', 'stock_check'],

  // Brand keywords scanned in product searches that found nothing (Tool Input and Question)
  BRANDS: ['Nike', 'New Balance', 'Adidas', 'ASICS', 'Hoka', 'Crocs', 'Mizuno', 'Jordan', 'Puma', 'Skechers', 'Under Armour', 'On Running', 'Brooks', 'Salomon', 'Reebok', 'Vans', 'Converse', 'Fila', 'Merrell', 'Speedo', 'Columbia', 'Saucony'],

  // Sport or category patterns scanned against the Question. First match wins.
  // Anything unmatched counts as "Specific model lookups".
  LOST_DEMAND_CATEGORIES: [
    { name: 'Running', pattern: 'running|วิ่ง|jogger|marathon|มาราธอน|novablast|metaspeed|cielo|kayano|cloudmonster|alphafly|pegasus|magnify' },
    { name: 'Football / Futsal', pattern: 'football|soccer|ฟุตบอล|ฟุตซอล|futsal|cleat|stud|สตั๊ด|kipsta|ginka' },
    { name: 'Tennis', pattern: 'tennis|เทนนิส' },
    { name: 'Badminton', pattern: 'badminton|แบดมินตัน|แบด|lining|halbartech|yonex' },
    { name: 'Volleyball', pattern: 'volleyball|วอลเลย์' },
    { name: 'Basketball', pattern: 'basketball|บาสเก็ตบอล' },
    { name: 'Casual / Lifestyle', pattern: 'casual|lifestyle|sneaker|ลำลอง|ไลฟ์สไตล์|crocs|classic|574|instapump' },
    { name: 'Walking / Everyday', pattern: 'เดินนาน|ใส่เดิน|ใส่ยืน|walking|lacoste|ลาคอส' },
    { name: 'Hiking / Trail', pattern: 'hiking|trail|trekking|เดินป่า|เทรล|teva' },
    { name: 'Apparel', pattern: 'shirt|t-shirt|jersey|pants|shorts|jacket|hoodie|กางเกง|เสื้อ|กระโปรง' },
    { name: 'Bags / Accessories', pattern: 'bag|backpack|กระเป๋า|เป้|jibbitz|จิบบิท' },
    { name: 'Swimming', pattern: 'swim|ว่ายน้ำ|goggles|speedo' },
    { name: 'Golf', pattern: 'golf|กอล์ฟ' },
    { name: 'Cycling', pattern: 'cycling|bike|จักรยาน|spinning' },
    { name: 'Fitness / Gym', pattern: 'gym|fitness|workout|treadmill|dumbbell|kettlebell|ฟิตเนส|ออกกำลังกาย|ลู่วิ่ง|ดัมเบล' },
    { name: 'Shoe accessories', pattern: 'สเปร|spray|insole|lace|sock|ถุงเท้า|กันลื่น' },
    { name: 'Safety / Work', pattern: 'safety|เซฟตี้|work boot' }
  ]
};

// ============================================================
// ROW RULES (V10's own heuristics, unchanged)
// ============================================================
var THAI_RE = /[฀-๿]/;
function detectLang(s) { return s && THAI_RE.test(s) ? 'th' : 'en'; }

// Machine error or empty result signals seen in Tool Output.
var TOOL_ERROR_RE = /(^|[\s\[(])(error|exception|traceback|failed|timeout|null|undefined)\b|\bstatus\s*[:=]\s*(4\d\d|5\d\d)\b|\[0\s+(items?|results?|products?|promos?)\]|\bfound\s+0\b|no\s+products?\s+found|ไม่พบสินค้า|ไม่พบโปรโมชัน|not\s+(found|in\s+system)|^\[0\s/i;

// Does the reply look like a raw, unformatted dump of the tool output?
function isRawEcho(out, resp) {
  var o = String(out || '').trim();
  var a = String(resp || '').trim();
  if (!a) return false;
  if (/^[\[{]/.test(a) && /[\]}]\s*$/.test(a)) return true;
  if (/^\s*\[\d+\s+(items?|results?|products?|promos?)\]/i.test(a)) return true;
  if (/^[^A-Za-z฀-๿]*("[\w ]+"\s*:\s*|[\w_]+\s*=\s*)/.test(a) && a.length < 400) return true;
  if (o.length > 12) {
    var norm = function (s) { return s.replace(/\s+/g, ' ').trim().toLowerCase(); };
    var na = norm(a), no = norm(o);
    if (na === no) return true;
    if (no.length > 24 && na.indexOf(no) !== -1) return true;
  }
  return false;
}

function toolOf(r) { return (r['Tool Used'] || '').trim() || '(direct response)'; }

// Product search that found nothing: a catalog gap signal.
function isZeroResultProduct(r) {
  var tool = toolOf(r);
  if (CONFIG.PRODUCT_SEARCH_TOOLS.indexOf(tool) === -1) return false;
  var out = String(r['Tool Output'] || '');
  var resp = String(r['Agent Response'] || '');

function computeOps(RA, range) {
  if (!RA.length) throw new Error('No rows with a valid "Timestamp (BKK)" column.');
  // When the export labels real direct replies "(direct response)", a blank Tool Used means
  // the log is missing tool details for that row. Older exports leave direct replies blank.
  var labelled = RA.some(function (r) { return r.direct_label; });
  RA.forEach(function (r) { r.tk = labelled ? !r.blank : true; });

  var first = range && range.from > dataFirst ? range.from : dataFirst;

  if (first > last) throw new Error('No answers in the selected timeframe.');
  var filtered = first !== dataFirst || last !== dataLast;
  var R = filtered ? RA.filter(function (r) { return r.date >= first && r.date <= last; }) : RA;
  if (!R.length) throw new Error('No answers in the selected timeframe.');
  var total_days = dayDiff(first, last) + 1;

  function S(rs, days) {
    var n = rs.length, T = 0, M = 0, tsum = 0, u15 = 0, failed = 0, f10 = 0, prod = 0, zero = 0;
    var sess = new Set(), zsess = new Set();

      var r = rs[i];

      if (r.mk) { M++; tsum += r.time; if (r.time < 15) u15++; }
      if (r.tk) {
        T++; if (r.f) failed++; if (r.f10) f10++;
        if (r.product) prod++;
        if (r.zero) { zero++; if (r.sid) zsess.add(r.sid); }
      }
    }
    return {
      days: days, answers: n, sessions: sess.size, per_day: n / days, sessions_per_day: sess.size / days,
      tool_known: T, time_known: M, avg_latency: M ? tsum / M : null, under15: M ? u15 / M : null,
      failed: failed, fail_rate: T ? failed / T : null, failed_v10: f10, fail_rate_v10: T ? f10 / T : null,
      product_searches: prod, zero_results: zero, zero_share: prod ? zero / prod : null, sessions_with_zero: zsess.size

  function between(a, b) { return R.filter(function (r) { return r.date >= a && r.date <= b; }); }

      avg_latency: mks >= 0.5 ? s.avg_latency : null, fail_rate: tks >= 0.5 ? s.fail_rate : null,

  function fr(xs) { if (!xs.length) return null; var f = 0; xs.forEach(function (r) { if (r.f) f++; }); return f / xs.length; }

    caps[c] = {

  var tools = Object.keys(byTool).map(function (name) {

    var xp = PK.filter(function (r) { return r.tool === name; });
    var ds = x.map(function (r) { return r.date; }).sort();
    var f10 = 0; x.forEach(function (r) { if (r.f10) f10++; });
    return {
      name: name, vol: x.length, share: x.length / K.length, latency: avgT(x), fail: fr(x), fail_v10: f10 / x.length,
      vol_l28: xl.length, share_l28: LK.length ? xl.length / LK.length : 0, latency_l28: avgT(xl), fail_l28: fr(xl), fail_p28: fr(xp),
      first: ds[0], last: ds[ds.length - 1], days_used: new Set(ds).size

  // worst run of consecutive outage days per tool (days with 5+ uses and failures above the threshold)
  tools.forEach(function (t) {

  var dayKeys = Object.keys(perDay).sort();
  var gaps = {
    blank_tool_rows: R.filter(function (r) { return !r.tk; }).length,
    blank_tool_days: dayKeys.filter(function (d) { return perDay[d][1] / perDay[d][0] > 0.5; }),
    no_time_days: dayKeys.filter(function (d) { return perDay[d][2] / perDay[d][0] > 0.5; })

  var h = R.filter(function (r) { return r.html; }).map(function (r) { return r.date; }).sort();
  var refundDays = R.filter(function (r) { return r.tool === 'refund_return'; }).map(function (r) { return r.date; }).sort();

  // searches that found nothing: by category and brand
  var catC = {}, brandC = {}, brandTotal = 0;
  K.forEach(function (r) {
    if (!r.zero) return;

  var sortObj = function (o) { return Object.keys(o).map(function (k) { return { name: k, value: o[k] }; }).sort(function (a, b) { return b.value - a.value; }); };

  return {
    window: { first: first, last: last, total_days: total_days, l28: l28, p28: p28, cmp_days: cmpDays, filtered: filtered, data_first: dataFirst, data_last: dataLast }, labelled: labelled,

    lost_demand: { categories: sortObj(catC), brands: sortObj(brandC), brand_total: brandTotal }

}

          f10: !!(fl & 4), f: !!(fl & 8), zero: !!(fl & 16), html: !!(fl & 32), mk: !!(fl & 64), time: t,
          product: CONFIG.PRODUCT_SEARCH_TOOLS.indexOf(tool) !== -1, sid: get('sid', i),
          cat: cat ? E.cats[cat - 1] : undefined, brand: brand ? E.brands[brand - 1] : null
        };
      }
      return R;
    });
  }

  // ---------- load Sheet 1 from the published Google Sheet ----------
  function load() {
    if (!CONFIG.DATA_URL || CONFIG.DATA_URL.indexOf('PASTE_') === 0) return Promise.reject(new Error('DATA_URL is not set. Open index.html and paste the published CSV address into CONFIG.DATA_URL.'));
    if (typeof Papa === 'undefined') return Promise.reject(new Error('The CSV reader (PapaParse) did not load. Check the internet connection and reload.'));
    var url = CONFIG.DATA_URL + (CONFIG.DATA_URL.indexOf('?') !== -1 ? '&' : '?') + '_=' + Date.now();
    return fetch(url, { cache: 'no-store', redirect: 'follow' }).then(function (res) {
      if (!res.ok) throw new Error('Google Sheets answered with HTTP ' + res.status + '.');
      setStep('Reading the chat log');
      return res.text();
    }).then(function (text) {
      if (/^\s*<(!doctype|html)/i.test(text)) throw new Error('The address returned a web page instead of CSV. Publish the sheet as CSV and use that link.');
      return new Promise(function (resolve, reject) {
        var R = [], seen = 0;
        setTimeout(function () {
          try {
            Papa.parse(text, {
              header: true, skipEmptyLines: true,
              step: function (res) { seen++; var r = makeRecord(res.data); if (r) R.push(r); },
              complete: function () {
                text = null;
                setStep('Working out the figures from ' + R.length.toLocaleString('en-US') + ' answers');
                setTimeout(function () {
                  try {
                    if (!R.length) throw new Error(seen ? 'No rows have a valid "Timestamp (BKK)" value.' : 'The sheet is empty.');
                    resolve(R);
                  } catch (e) { reject(e); }
                }, 20);
              },
              error: function (e) { reject(e); }
            });
          } catch (e) { reject(e); }
        }, 20);
      });
    });
  }

  // ---------- load Sheet 2 (customer ratings) from the same Google Sheet ----------
  function loadRatings() {
    var stored = function (why) { if (why && window.console) console.warn('Sheet 2 not read: ' + why); return { list: snapshotAsRatings(), source: 'stored' }; };
    if (!CONFIG.FEEDBACK_URL) return Promise.resolve(stored('FEEDBACK_URL is empty'));
    var url = CONFIG.FEEDBACK_URL + (CONFIG.FEEDBACK_URL.indexOf('?') !== -1 ? '&' : '?') + '_=' + Date.now();
    return fetch(url, { cache: 'no-store', redirect: 'follow' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(function (text) {
      var parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
      var fields = parsed.meta.fields || [];
      if (fields.indexOf('Rating') === -1) throw new Error('no "Rating" column; is FEEDBACK_URL the Sheet 2 link?');
      var list = normalizeRatings(parsed.data, handCodeMap());
      if (!list.length) throw new Error('no ratings found');
      return { list: list, source: 'live' };
    }).catch(function (e) { return stored(e.message); });
  }

  if (window.V12_EMBED) {
    setStep('Opening the stored data');
    unpackRecords(window.V12_EMBED.records).then(function (R) { start(R, { list: window.V12_EMBED.ratings, source: 'file' }); }).catch(fail);
  } else {
    Promise.all([load(), loadRatings()]).then(function (x) { start(x[0], x[1]); }).catch(fail);
  }
})();

// ============================================================
// EXCEL EXPORT: rated questions and answers for the team to review,
// with columns to write the expected answer. ExcelJS loads only when
// someone clicks an export button.
// ============================================================
(function () {
  'use strict';
  var EXCELJS_URLS = [
    'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
    'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'
  ];
  var loading = null;

  function loadScript(i) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = EXCELJS_URLS[i]; s.async = true;
      s.onload = function () { window.ExcelJS ? resolve() : reject(new Error('ExcelJS missing')); };
      s.onerror = function () { s.remove(); reject(new Error('could not load ' + EXCELJS_URLS[i])); };
      document.head.appendChild(s);
    });
  }
  function loadExcelJS() {
    if (window.ExcelJS) return Promise.resolve();
    if (!loading) {
      loading = loadScript(0).catch(function () { return loadScript(1); });
      loading.catch(function () { loading = null; });
    }
    return loading;
  }
  function setStatus(t) { var el = document.getElementById('export-status'); if (el) el.textContent = t; }

  var HEAD_FILL = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F2A37' } };
  var FILL_TEAM = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF6D6' } };
  var FILL_TEAM_HEAD = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB7791F' } };
  var BORDER = { top: { style: 'thin', color: { argb: 'FFE1E0D9' } }, bottom: { style: 'thin', color: { argb: 'FFE1E0D9' } }, left: { style: 'thin', color: { argb: 'FFE1E0D9' } }, right: { style: 'thin', color: { argb: 'FFE1E0D9' } } };
  function styleHead(row, teamCols) {
    row.height = 30;
    row.eachCell(function (c, n) {
      c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
      c.fill = teamCols && teamCols.indexOf(n) !== -1 ? FILL_TEAM_HEAD : HEAD_FILL;
      c.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
      c.border = BORDER;
    });
  }
  // rough row height so long answers are readable without resizing
  function fitHeight(row, widths) {
    var lines = 1;
    row.eachCell(function (c, n) {
      var v = c.value == null ? '' : String(c.value), w = widths[n - 1] || 12;
      var l = v.split('\n').reduce(function (t, p) { return t + Math.max(1, Math.ceil(p.length / (w * 1.1))); }, 0);
      if (l > lines) lines = l;
    });
    row.height = Math.min(409, Math.max(18, lines * 15));
  }

  function build(topic, nhOnly) {
    var D = window.V11_RATINGS, order = D.topics;
    var rows = D.list.filter(function (r) { return (topic === 'all' || r.topic_label === topic) && (!nhOnly || !r.helpful); });
    rows.sort(function (a, b) {
      var ta = order.indexOf(a.topic_label), tb = order.indexOf(b.topic_label);
      if (ta !== tb) return ta - tb;
      if (a.helpful !== b.helpful) return a.helpful - b.helpful;      // Not helpful first
      return a.when < b.when ? 1 : -1;                                // newest first
    });
    var wb = new window.ExcelJS.Workbook();
    wb.creator = 'Virtual AI Assistant dashboard'; wb.created = new Date();

    // ---- sheet 1: review
    var ws = wb.addWorksheet('Review', { views: [{ state: 'frozen', xSplit: 0, ySplit: 1 }],
      pageSetup: { orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
    ws.pageSetup.printTitlesRow = '1:1';
    var cols = [
      ['No.', 6], ['Date (Bangkok)', 16], ['Topic', 20], ['Rating', 12], ['Main reason', 22],
      ['Customer question', 42], ['AI answer', 60], ['Customer comment', 30], ['What to teach the AI (suggested)', 42],
      ['Expected answer (team)', 60],
      ['Message ID', 14], ['Session ID', 18], ['Topic coded by', 14]
    ];
    var widths = cols.map(function (c) { return c[1]; });
    ws.columns = cols.map(function (c) { return { header: c[0], width: c[1] }; });
    styleHead(ws.getRow(1), [10]);
    rows.forEach(function (r, i) {
      var row = ws.addRow([
        i + 1, r.when, r.topic_label, r.helpful ? 'Helpful' : 'Not helpful', r.helpful ? '' : (D.SHORT[r.cause] || 'Other'),
        r.question || '', r.answer || '', r.comment_en && r.comment_en !== r.comment ? r.comment + '\n(English: ' + r.comment_en + ')' : (r.comment || ''),
        r.helpful ? 'Answer worked: keep as a good example.' : (D.TEACH[r.cause] || ''),
        '', r.id, r.session, r.coded ? 'Hand' : 'Rules'
      ]);
      row.eachCell({ includeEmpty: true }, function (c, n) {
        c.alignment = { vertical: 'top', wrapText: true };
        c.border = BORDER;
        if (n === 10) c.fill = FILL_TEAM;
      });
      row.getCell(4).font = { bold: true, color: { argb: r.helpful ? 'FF1D5FAE' : 'FFC0392B' } };
      fitHeight(row, widths.map(function (w, k) { return k === 9 ? 200 : w; }));
    });
    ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: Math.max(1, rows.length + 1), column: cols.length } };

    // ---- sheet 2: topic summary
    var ts = wb.addWorksheet('Topic summary', { views: [{ state: 'frozen', ySplit: 1 }] });
    ts.columns = [
      { header: 'Topic', width: 24 }, { header: 'Ratings', width: 10 }, { header: 'Helpful', width: 10 }, { header: 'Not helpful', width: 12 },
      { header: 'Helpful rate', width: 12 }, { header: 'Main reason', width: 30 }, { header: 'What to teach the AI', width: 70 }
    ];
    styleHead(ts.getRow(1));
    order.filter(function (t) { return topic === 'all' || t === topic; }).forEach(function (t) {
      var x = D.list.filter(function (r) { return r.topic_label === t; });
      var h = x.filter(function (r) { return r.helpful; }).length, c = {};
      x.forEach(function (r) { if (!r.helpful) c[r.cause] = (c[r.cause] || 0) + 1; });
      var top = Object.keys(c).sort(function (a, b) { return c[b] - c[a]; })[0];
      var row = ts.addRow([t, x.length, h, x.length - h, x.length ? h / x.length : 0, top ? D.SHORT[top] + ' (' + c[top] + ')' : 'None', top ? D.TEACH[top] : D.TEACH_OK]);
      row.getCell(5).numFmt = '0%';
      row.eachCell(function (cell) { cell.alignment = { vertical: 'top', wrapText: true }; cell.border = BORDER; });
      fitHeight(row, [24, 10, 10, 12, 12, 30, 70]);
    });

    // ---- sheet 3: how to use
    var hs = wb.addWorksheet('How to use');
    hs.getColumn(1).width = 110;
    [
      ['How to use this file', true],
      ['Exported ' + new Date().toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) + ' from the Virtual AI Assistant dashboard. Ratings from ' + D.from + ' to ' + D.to + ' (Bangkok time). ' + rows.length + ' answers' + (topic === 'all' ? ', all topics' : ', topic: ' + topic) + (nhOnly ? ', Not helpful only.' : '.'), false],
      ['', false],
      ['1. Work through the Review sheet topic by topic. Topics with the most Not helpful ratings come first, and within each topic Not helpful answers come before Helpful ones.', false],
      ['2. Read the customer question and the AI answer, then write the answer the AI should have given in "Expected answer (team)". Use the suggested lesson as a starting point.', false],
      ['3. The yellow column is for the team; the rest come from the dashboard.', false],
      ['4. Helpful answers are good examples: keep them as reference answers when you update the AI.', false],
      ['', false],
      ['Notes', true],
      ['Main reason and topic: the first ratings were coded by hand ("Hand" in the last column); newer ones are coded by keyword rules ("Rules"), so correct them if they look wrong.', false],
      ['Emails, phone numbers, order numbers and tracking numbers are hidden as [email], [phone], [order no.] and [tracking no.].', false],
      ['A fresh export always reflects the latest ratings in Sheet 2. Keep your reviewed copy separately, or paste new rows into it.', false]
    ].forEach(function (x) {
      var row = hs.addRow([x[0]]);
      row.getCell(1).alignment = { wrapText: true, vertical: 'top' };
      if (x[1]) row.getCell(1).font = { bold: true, size: 13 };
      fitHeight(row, [110]);
    });
    return { wb: wb, n: rows.length };
  }

  function slug(t) { return t === 'all' ? 'all_topics' : t.replace(/&/g, 'and').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, ''); }

  function exportReview(topic) {
    if (!window.V11_RATINGS) return;
    var nhBox = document.getElementById('export-nh-only'), nhOnly = !!(nhBox && nhBox.checked);
    setStatus('Preparing the Excel file...');
    return loadExcelJS().then(function () {
      var b = build(topic, nhOnly);
      if (!b.n) { setStatus('No answers match this choice.'); return; }
      return b.wb.xlsx.writeBuffer().then(function (buf) {
        var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'AI_answer_review_' + slug(topic) + (nhOnly ? '_not_helpful' : '') + '_' + new Date().toISOString().slice(0, 10) + '.xlsx';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        setStatus('Downloaded ' + b.n + ' answers' + (topic === 'all' ? '' : ' for ' + topic) + '.');
      });
    }).catch(function (e) {
      setStatus('Could not create the Excel file: ' + (e && e.message ? e.message : e) + '. Check the internet connection and try again.');
      if (window.console) console.error(e);
    });
  }
  window.V11ExportReview = exportReview;

  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest && ev.target.closest('[data-export]');
    if (!btn || btn.disabled) return;
    ev.preventDefault();
    btn.disabled = true;
    Promise.resolve(exportReview(btn.getAttribute('data-export'))).then(function () { btn.disabled = false; });
  });
})();

</script>
